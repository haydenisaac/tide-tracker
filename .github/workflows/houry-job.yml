name: Go


on:
  push:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27.x'

    - name: Run
      env:
        USER: ${{secrets.USER}}
        PASSWORD: ${{secrets.PASSWORD}}
        RECIPIENTS: ${{secrets.RECIPIENTS}}
        LOCATION: ${{secrets.LOCATION}}
      run: go run .